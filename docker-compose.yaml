services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: conduit-backend
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: database
      DB_PORT: 5432
    ports:
      - "${BACKEND_HOST_PORT:-5000}:${BACKEND_PORT:-5000}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:$${BACKEND_PORT:-5000}/api/tags > /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: conduit-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      FRONTEND_INTERNAL_PORT: ${FRONTEND_INTERNAL_PORT:-80}
      BACKEND_HOST: backend
      BACKEND_PORT: ${BACKEND_PORT:-5000}
    ports:
      - "8282:${FRONTEND_INTERNAL_PORT:-80}"

volumes:
  postgres_data:
