# Production / deployment stack.
#
# This file deliberately contains NO `build:` sections: on the cloud VM the
# images are pulled from the container registry, they are never built there.
# The images are built and pushed by .github/workflows/deployment.yaml.
#
# For local development, docker-compose.override.yaml (automatically merged by
# `docker compose`) adds the build definitions back in.

x-logging: &default_logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-5}"

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default_logging

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/mshaninah}/conduit-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: database
      DB_PORT: 5432
    # No `ports:` here on purpose: the backend is only ever reached through the
    # frontend's Nginx proxy, so on the VM it stays on the internal Compose
    # network. docker-compose.override.yaml publishes it for local debugging.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:$${BACKEND_PORT:-5000}/api/tags > /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default_logging

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/mshaninah}/conduit-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      FRONTEND_INTERNAL_PORT: ${FRONTEND_INTERNAL_PORT:-80}
      BACKEND_HOST: backend
      BACKEND_PORT: ${BACKEND_PORT:-5000}
    ports:
      - "${FRONTEND_HOST_PORT:-8282}:${FRONTEND_INTERNAL_PORT:-80}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://127.0.0.1:$${FRONTEND_INTERNAL_PORT:-80}/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default_logging

volumes:
  postgres_data:
